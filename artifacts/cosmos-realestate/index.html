<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These are defaults for crawlers that read the raw HTML. Every route
      overrides them at runtime via react-helmet-async (see src/components/seo.tsx).
    -->
    <title>Cosmos Real Estate | Property Dealers in Pune Since 2004</title>
    <meta
      name="description"
      content="Buy, sell or rent residential, commercial and industrial property in Pune. NAR India certified brokers with 20+ years of experience and verified listings."
    />
    <meta
      name="keywords"
      content="real estate Pune, property dealers Pune, flats in Pune, commercial property Pune, industrial land Pune, warehouse Chakan"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Cosmos Real Estate" />
    <link rel="canonical" href="https://www.cosmosrealestate.co.in/" />

    <!-- Geo targeting for local search -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Pune" />
    <meta name="theme-color" content="#B4472F" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Cosmos Real Estate" />
    <meta property="og:title" content="Cosmos Real Estate | Property Dealers in Pune Since 2004" />
    <meta
      property="og:description"
      content="Buy, sell or rent residential, commercial and industrial property in Pune. NAR India certified brokers with 20+ years of experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cosmosrealestate.co.in/" />
    <meta property="og:image" content="https://www.cosmosrealestate.co.in/opengraph.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cosmos Real Estate | Property Dealers in Pune" />
    <meta
      name="twitter:description"
      content="Buy, sell or rent residential, commercial and industrial property in Pune. NAR India certified brokers."
    />
    <meta name="twitter:image" content="https://www.cosmosrealestate.co.in/opengraph.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
